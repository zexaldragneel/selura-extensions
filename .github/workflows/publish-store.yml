name: Publish Selura Extension Store

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-store.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-store.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selura-store-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run catalog and signer contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests

  publish:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-selura-store]'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publishing source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified public release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-apks"
          reader_repo="zexaldragneel/selura-reader"
          gh release download test-selura-source-pr-25-run-12 \
            --repo "$reader_repo" --pattern selura-nhentai.apk \
            --dir "$RUNNER_TEMP/source-apks"
          gh release download test-selura-mangadex-pr-26-run-3 \
            --repo "$reader_repo" --pattern selura-mangadex.apk \
            --dir "$RUNNER_TEMP/source-apks"
          gh release download test-selura-batch-pr-28-run-6 \
            --repo "$reader_repo" --pattern '*.apk' \
            --dir "$RUNNER_TEMP/source-apks"
          gh release download test-orphaned-18-pr-29-run-4 \
            --repo "$reader_repo" --pattern '*.apk' \
            --dir "$RUNNER_TEMP/source-apks"
          # Reader PR #32 CI publishes this immutable batch only after all
          # 12 release APKs pass Gradle build/lint/signature validation.
          gh release download test-expansion-12-pr-32-run-2 \
            --repo "$reader_repo" --pattern '*.apk' \
            --dir "$RUNNER_TEMP/source-apks"
          # PR #43: 5 NEW independently signed APKs. Publication only after
          # both Android source compile/lint/signature shards have passed.
          gh release download test-expansion-5-pr-43-run-1 \
            --repo "$reader_repo" --pattern '*.apk' \
            --dir "$RUNNER_TEMP/source-apks"
          # Preserve previously published 42 APKs: only Comix.to gets updated.
          mkdir -p "$RUNNER_TEMP/comix-update"
          gh release download test-expansion-5-pr-43-run-6 \
            --repo "$reader_repo" --pattern seluracomixto.apk \
            --dir "$RUNNER_TEMP/comix-update"
          test -s "$RUNNER_TEMP/comix-update/seluracomixto.apk"
          mv "$RUNNER_TEMP/comix-update/seluracomixto.apk" "$RUNNER_TEMP/source-apks/seluracomixto.apk"
          # Replace only Hive Scans with the separately verified Kotlin APK.
          # PR #87 restores the pre-optimization Hive Scans image request
          # behavior following an owner-reported Cloudflare challenge.
          # Do not merge until its higher-version signed APK is verified.
          # The other 42 existing signed APKs come from immutable releases.
          mkdir -p "$RUNNER_TEMP/hive-update"
          gh release download test-hivescans-pr-87-run-3 \
            --repo "$reader_repo" --pattern selurahivescans.apk \
            --dir "$RUNNER_TEMP/hive-update"
          test -s "$RUNNER_TEMP/hive-update/selurahivescans.apk"
          mv "$RUNNER_TEMP/hive-update/selurahivescans.apk" "$RUNNER_TEMP/source-apks/selurahivescans.apk"
          # One independently signed Weeb Central page parser update.
          # Keep the owner-tested Hive Scans rollback pin above untouched.
          mkdir -p "$RUNNER_TEMP/weebcentral-update"
          gh release download test-weebcentral-pr-90-run-1 \
            --repo "$reader_repo" --pattern seluraweebcentral.apk \
            --dir "$RUNNER_TEMP/weebcentral-update"
          test -s "$RUNNER_TEMP/weebcentral-update/seluraweebcentral.apk"
          mv "$RUNNER_TEMP/weebcentral-update/seluraweebcentral.apk" "$RUNNER_TEMP/source-apks/seluraweebcentral.apk"
          # Replace only Doujins with the separately compiled and signed
          # gallery reliability update from native source PR #103.
          # No Play Protect bypass; preserve all 42 other extension APKs.
          mkdir -p "$RUNNER_TEMP/doujins-update"
          gh release download test-doujins-pr-103-run-4 \
            --repo "$reader_repo" --pattern seluradoujins.apk \
            --dir "$RUNNER_TEMP/doujins-update"
          test -s "$RUNNER_TEMP/doujins-update/seluradoujins.apk"
          mv "$RUNNER_TEMP/doujins-update/seluradoujins.apk" "$RUNNER_TEMP/source-apks/seluradoujins.apk"
          # One-extension Mangakakalot CDN + source pacing improvement (original package & signer).
          # The 42 other released extension binaries stay identical.
          mkdir -p "$RUNNER_TEMP/mangakakalot-update"
          gh release download test-mangakakalot-pr-126-run-7 \
            --repo "$reader_repo" --pattern seluramangakakalot.apk \
            --dir "$RUNNER_TEMP/mangakakalot-update"
          test -s "$RUNNER_TEMP/mangakakalot-update/seluramangakakalot.apk"
          mv "$RUNNER_TEMP/mangakakalot-update/seluramangakakalot.apk" "$RUNNER_TEMP/source-apks/seluramangakakalot.apk"
          # Exactly 2 legacy + 6 batch + 18 orphaned + 12 expansion + 5 new.
          test "$(find "$RUNNER_TEMP/source-apks" -maxdepth 1 -name '*.apk' | wc -l)" -eq 43
          echo "43 signed APKs downloaded. Signer, APK package, source IDs and versions verified during index generation."
      - name: Generate public index, icons, APKs and manifest
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$sdk_dir/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$sdk_dir/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          python3 scripts/generate_store.py \
            --apk-dir "$RUNNER_TEMP/source-apks" \
            --output-dir "$RUNNER_TEMP/public-store" \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER"
          test -s "$RUNNER_TEMP/public-store/index.json"
          test -s "$RUNNER_TEMP/public-store/repo.json"
          test -s "$RUNNER_TEMP/public-store/apk/selura-nhentai.apk"
          test -s "$RUNNER_TEMP/public-store/apk/selura-mangadex.apk"
          for apk in seluramangaplus selurawebtoons seluramangafire seluramangapill seluramangakatana seluramangabat; do
            test -s "$RUNNER_TEMP/public-store/apk/$apk.apk"
          done
          for apk in selurahentai3 seluraallporncomic seluraasurascans seluradoujins \
            seluraflamecomics selurahdoujin selurahentai4free selurahentaihand \
            selurahentairead selurahiperdex selurahivescans seluramangageko \
            seluramangakakalot seluramgreadio seluratoongod seluratoonily \
            seluravortexscans selurawebtoonxyz; do
            test -s "$RUNNER_TEMP/public-store/apk/$apk.apk"
          done
          for apk in seluracomicklive seluraglobalcomix seluramangatoon seluramangaup \
            seluramangapluscreators seluranamicomi seluradynasty \
            seluragunnerkriggcourt seluramangago seluramangahere seluramangafox \
            seluramanganato; do
            test -s "$RUNNER_TEMP/public-store/apk/$apk.apk"
          done
          for apk in seluracomixto seluraweebcentral selurakagane seluramangaball seluramangahubio; do
            test -s "$RUNNER_TEMP/public-store/apk/$apk.apk"
          done
          test "$(find "$RUNNER_TEMP/public-store/apk" -maxdepth 1 -name '*.apk' | wc -l)" -eq 43
          sha256sum "$RUNNER_TEMP/public-store/apk/"*.apk
      - name: Verify 42 unchanged APKs, all source IDs and 43 icons preserved
        run: |
          set -euo pipefail
          git fetch origin repo
          git show FETCH_HEAD:index.json > "$RUNNER_TEMP/previous-index.json"
          python3 scripts/validate_mangakakalot_update.py \
            "$RUNNER_TEMP/previous-index.json" \
            "$RUNNER_TEMP/public-store/index.json" \
            "$RUNNER_TEMP/public-store" \
            FETCH_HEAD
      - name: Publish generated files on dedicated public repo branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin repo >/dev/null; then
            git fetch origin repo
            git switch -C repo FETCH_HEAD
          else
            git switch --orphan repo
          fi
          # Only a generated store branch is replaced. Never touch main,
          # private sources or device libraries.
          git rm -rf --ignore-unmatch . >/dev/null || true
          cp -R "$RUNNER_TEMP/public-store/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Store files unchanged"
          else
            git commit -m "chore: publish verified signed Selura extension index"
            git push origin HEAD:repo
          fi
      - name: Show the add-store URL
        run: |
          echo "Selura store: https://raw.githubusercontent.com/zexaldragneel/selura-extensions/repo/repo.json"
